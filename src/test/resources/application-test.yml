spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

app:
  seed:
    enabled: false
  jwt:
    secret: campusos-test-secret-key-change-me-in-production-0123456789abcdef
  rate-limit:
    auth-requests-per-minute: 1000
